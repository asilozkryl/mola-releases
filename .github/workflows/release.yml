# Mola'nın sürüm paketlerini derler ve bu depoda yayımlar. Kaynak kod bu depoda değildir: gizli
# kaynak deposu salt okunur bir anahtarla (MOLA_DEPLOY_KEY) çekilir, verilen etiket derlenir.
# Elle çalıştırılır: Actions → Sürüm → Run workflow → etiket (ör. v1.2.0).
# Eylemler etiket yerine tam commit kimliğine sabitlenmiştir.
name: Sürüm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Kaynak deposundaki sürüm etiketi (ör. v1.2.0)
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}
  SOURCE_REPO: asilozkryl/mola
  # gh komutları, çekilen kaynak deposunu değil bu depoyu hedefler.
  GH_REPO: ${{ github.repository }}
  # Opus'u Windows ve macOS'ta kaynaktan, durağan olarak derle: kullanıcının makinesinde
  # libopus aranmasın. Paketle gelen Opus kaynağı eski bir CMake sürümü bildirdiği için
  # yeni CMake'e en düşük ilke sürümünü açıkça veriyoruz.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  create-release:
    name: Taslak sürüm
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.MOLA_DEPLOY_KEY }}
          persist-credentials: false

      - name: Etiket ile uygulama sürümü aynı mı?
        run: |
          app="v$(jq -r .version desktop/src-tauri/tauri.conf.json)"
          server="v$(grep -m1 '^version' server/Cargo.toml | cut -d'"' -f2)"
          if [ "$app" != "$TAG" ] || [ "$server" != "$TAG" ]; then
            echo "::error::Etiket $TAG; masaüstü sürümü $app, sunucu sürümü $server. Önce sürüm numaralarını güncelle."
            exit 1
          fi

      - name: Taslak sürümü oluştur
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # İş akışı yeniden çalıştırılırsa var olan sürüm kullanılır.
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Mola ${TAG#v}" --notes "Paketler derleniyor."
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Masaüstü (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Eski bir Ubuntu'da derlemek, paketin daha eski dağıtımlarda da çalışmasını sağlar.
          - { name: Linux, os: ubuntu-22.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS Apple Silicon, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.MOLA_DEPLOY_KEY }}
          persist-credentials: false

      - name: Sistem paketleri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libopus-dev libxdo-dev libssl-dev patchelf

      - name: Opus'u durağan derle (Windows, macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          echo "LIBOPUS_STATIC=1" >> "$GITHUB_ENV"
          echo "LIBOPUS_NO_PKG=1" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable dalı
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - name: Arayüz bağımlılıkları
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # Uygulama kendini güncelleyebilsin diye paketler imzalanır (yanlarına .sig dosyası çıkar).
      # Bunu açan ayar dosyası 1.5.0 ile geldi; daha eski bir etiket derlenirse imzasız derlenir.
      - name: Güncelleme imzaları
        id: updater
        shell: bash
        run: |
          if [ -f desktop/src-tauri/tauri.release.conf.json ]; then
            echo "args=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # İmza anahtarı parolasızdır. Açık anahtar uygulamanın tauri.conf.json dosyasında durur;
          # bu sır kaybolursa ya da değişirse kurulu uygulamalar yeni sürümleri reddeder.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: desktop
          args: ${{ steps.updater.outputs.args }}
          # Paketler bu depodaki taslak sürüme yüklenir.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Güncelleme bildirimi (latest.json) yayımlama adımında, bütün platformlar bittikten sonra
          # tek seferde üretilir; platformlar aynı dosyayı ayrı ayrı güncellemeye çalışmaz.
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true

  server:
    name: Sunucu (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04, suffix: x86_64-linux, binary: mola-server }
          - { name: Windows, os: windows-latest, suffix: x86_64-windows, binary: mola-server.exe }
          - { name: macOS Apple Silicon, os: macos-latest, suffix: aarch64-macos, binary: mola-server }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.MOLA_DEPLOY_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable dalı
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Derle
        run: cargo build --release -p mola-server

      # Tarayıcı arayüzü sunucu paketine girer; sunucu onu `web` klasöründen kendisi sunar.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Web arayüzünü derle
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Yayımlanacak ikilinin kendisi sınanır; yalnızca derlenmiş olması yetmez.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Uçtan uca test (sürüm ikilisi)
        run: |
          export MOLA_DB="$RUNNER_TEMP/mola.db" MOLA_UPLOADS="$RUNNER_TEMP/uploads"
          # Web arayüzünü sunma testi için küçük bir örnek klasör.
          mkdir -p "$RUNNER_TEMP/web/assets"
          echo '<!doctype html><title>Mola</title><div id=root></div>' > "$RUNNER_TEMP/web/index.html"
          echo 'console.log(1)' > "$RUNNER_TEMP/web/assets/app-abc.js"
          echo gizli > "$RUNNER_TEMP/web/.env"
          export MOLA_WEB="$RUNNER_TEMP/web"
          MOLA_ADDR=127.0.0.1:7899 MOLA_STT_URL=http://127.0.0.1:7832/v1/audio/transcriptions MOLA_STT_API_KEY=test-stt MOLA_HOOK_ALLOW=127.0.0.1:7830 MOLA_ADMINS=yonetici1 MOLA_PUSH_ALLOW=127.0.0.1:7829 MOLA_AI_API_KEY=test-anahtar MOLA_AI_URL=http://127.0.0.1:7828/v1/messages MOLA_GOOGLE_CLIENT_ID=test-istemci MOLA_GOOGLE_CLIENT_SECRET=test-gizli MOLA_PUBLIC_URL=http://127.0.0.1:7899 MOLA_GOOGLE_AUTH_URL=http://127.0.0.1:7827/auth MOLA_GOOGLE_TOKEN_URL=http://127.0.0.1:7827/token MOLA_PREVIEW_ALLOW=127.0.0.1:7831 MOLA_SMTP_URL=smtp://127.0.0.1:7825 MOLA_MAIL_FROM="Mola <mola@ornek.test>" \
            "./target/release/${{ matrix.binary }}" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:7899/api/health > /dev/null && break
            sleep 0.2
          done
          MOLA_URL=http://127.0.0.1:7899 MOLA_BIN="$PWD/target/release/${{ matrix.binary }}" node server/tests/e2e.mjs

      - name: Paketle
        id: package
        run: |
          version=$(grep -m1 '^version' server/Cargo.toml | cut -d'"' -f2)
          name="mola-server-$version-${{ matrix.suffix }}"
          mkdir "$name"
          cp "target/release/${{ matrix.binary }}" server/KULLANIM.txt "$name/"
          cp -r desktop/dist "$name/web"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.file }}
          path: ${{ steps.package.outputs.file }}

      - name: Sürüme yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.file }}" --clobber

  publish:
    name: Sürümü yayımla
    needs: [create-release, desktop, server]
    # Yalnızca bütün platformlar başarılıysa: yarım bir sürüm yayımlanmaz.
    runs-on: ubuntu-latest
    steps:
      - name: Güncelleme bildirimini ve sağlamaları üret, yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets
          rm -f assets/SHA256SUMS.txt assets/latest.json

          # Güncelleme bildirimi: kurulu uygulamalar "en son sürüm"ün latest.json dosyasına bakar,
          # kendi paket türünün satırındaki dosyayı indirir ve imzasını doğrular. Satırlar imzası
          # (.sig) olan paketlerden üretilir; adresler sürüm yayımlanınca geçerli olur.
          # Uygulama önce "işletim sistemi-mimari-paket türü" anahtarına, yoksa türsüz olana bakar.
          # Windows ve Linux'ta türsüz anahtar bilerek yazılmaz: .deb kurulumu AppImage dosyasını
          # indirip kurmaya çalışmasın. Satırı olmayan paket türü güncellenmez, yalnızca haber alır.
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          for sig in assets/*.sig; do
            [ -e "$sig" ] || continue
            file=$(basename "${sig%.sig}")
            case "$file" in
              *_aarch64.app.tar.gz) keys="darwin-aarch64-app darwin-aarch64" ;;
              *-setup.exe) keys="windows-x86_64-nsis" ;;
              *.msi) keys="windows-x86_64-msi" ;;
              *.AppImage) keys="linux-x86_64-appimage" ;;
              *.deb) keys="linux-x86_64-deb" ;;
              *.rpm) keys="linux-x86_64-rpm" ;;
              *) echo "::warning::İmzası olan ama tanınmayan paket: $file"; continue ;;
            esac
            for key in $keys; do
              jq -n --arg key "$key" --arg signature "$(cat "$sig")" --arg url "$base/$file" \
                '{($key): {signature: $signature, url: $url}}'
            done
          done | jq -s --arg version "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, pub_date: $date, platforms: (add // {})}' > latest.json
          jq '{version, platforms: (.platforms | keys)}' latest.json
          # İmzalı sürümde bir işletim sistemi eksik kalırsa oradaki uygulamalar güncellenemez:
          # eksik sürüm yayımlanmaz, taslak kalır. Diğer paket türleri eksikse yalnızca uyarılır.
          if [ "$(jq '.platforms | length' latest.json)" -gt 0 ]; then
            for key in darwin-aarch64 windows-x86_64-nsis linux-x86_64-appimage; do
              jq -e --arg key "$key" '.platforms[$key]' latest.json > /dev/null ||
                { echo "::error::latest.json içinde $key yok; imza dosyası üretilmemiş."; exit 1; }
            done
            for key in windows-x86_64-msi linux-x86_64-deb linux-x86_64-rpm; do
              jq -e --arg key "$key" '.platforms[$key]' latest.json > /dev/null ||
                echo "::warning::latest.json içinde $key yok; bu paket türü kendini güncelleyemez, yalnızca haber verir."
            done
            gh release upload "$TAG" latest.json --clobber
          fi

          # Sağlamalar kullanıcının indirdiği paketler içindir; imza dosyaları listeye girmez.
          (cd assets && rm -f -- *.sig && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false
